name: Build CALL of BLOK and publish GitHub release

run-name: Build "${{ github.event.head_commit.message || github.ref_name }}" from bargmy/PexOfDuty

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android (temporarily disabled by default)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  windows_x64:
    name: Windows x64 (MinGW)
    runs-on: windows-latest

    steps:
      - name: Clone bargmy/PexOfDuty
        uses: actions/checkout@v4
        with:
          repository: bargmy/PexOfDuty
          ref: main
          token: ${{ secrets.PEXOFDUTY_TOKEN || github.token }}
          set-safe-directory: true

      - name: Read commit name
        id: commit
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          name="$(git log -1 --pretty=%s 2>/dev/null || true)"
          [ -n "$name" ] || name="${{ github.ref_name }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Cache llvm-mingw toolchain and static dependencies
        id: windows-toolchain
        uses: actions/cache@v4
        with:
          path: C:/llvm-mingw
          key: windows-${{ runner.arch }}-llvm-mingw-20261006-ucrt-static-deps-v1

      - name: Install llvm-mingw toolchain
        if: steps.windows-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          echo "Downloading llvm-mingw 20261006 (Windows-native, UCRT)..."
          curl -fL --retry 3 --retry-delay 3 \
            -o "$RUNNER_TEMP/llvm-mingw.zip" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip
          rm -rf /c/llvm-mingw
          mkdir -p /c/llvm-mingw
          zipfile="$RUNNER_TEMP/llvm-mingw.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$zipfile' -DestinationPath 'C:/llvm-mingw' -Force"
          root=/c/llvm-mingw/llvm-mingw-20261006-ucrt-x86_64
          bin=$root/bin
          "$bin/x86_64-w64-mingw32-clang.exe" --version | head -n 2
          # llvm-mingw ships the compiler but no vorbis/ogg/zlib; the preinstalled
          # stub msys2's pacman provides them. Use the UCRT64 flavor to match
          # llvm-mingw's UCRT runtime, and place the static archives the same
          # way the local llvm-mingw installs them (root lib/ plus sysroot).
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-libvorbis \
            mingw-w64-ucrt-x86_64-libogg \
            mingw-w64-ucrt-x86_64-zlib
          sysroot=$root/x86_64-w64-mingw32
          mkdir -p "$root/lib" "$sysroot/lib" "$sysroot/include"
          for lib in libvorbisfile libvorbis libvorbisenc libogg libz; do
            cp -f /c/msys64/ucrt64/lib/$lib.a "$root/lib/" || true
            cp -f /c/msys64/ucrt64/lib/$lib.a "$sysroot/lib/" || true
          done
          ls "$root/lib" | grep -E 'vorbis|ogg|^libz' || true
          cp -rf /c/msys64/ucrt64/include/vorbis /c/msys64/ucrt64/include/ogg "$sysroot/include/"
          cp -f /c/msys64/ucrt64/include/zlib.h /c/msys64/ucrt64/include/zconf.h "$sysroot/include/"
          ls "$sysroot/lib" | grep -E 'vorbis|ogg|^libz' || true

      - name: Configure llvm-mingw toolchain
        shell: bash
        run: |
          test -x /c/llvm-mingw/llvm-mingw-20261006-ucrt-x86_64/bin/x86_64-w64-mingw32-clang.exe
          echo "MINGW64_BIN=C:\\llvm-mingw\\llvm-mingw-20261006-ucrt-x86_64\\bin" >> "$GITHUB_ENV"

      - name: Build Windows x64 client
        shell: bash
        run: |
          set +e
          mkdir -p build logs dist
          {
            echo "Commit name: ${{ steps.commit.outputs.name }}"
            echo "Commit SHA:  $GITHUB_SHA"
            echo "Builder:     CALL of BLOK Windows x64 llvm-mingw (clang)"
            echo
            ccbin=$(cygpath -u "$MINGW64_BIN")
            "$ccbin/x86_64-w64-mingw32-clang.exe" --version
            # build_x64.bat wants the target-prefixed driver names; llvm-mingw
            # ships them natively. Verify (and fix) as a net.
            for t in gcc windres; do
              if [ -f "$ccbin/x86_64-w64-mingw32-$t.exe" ]; then
                echo "  $ccbin: prefixed $t present"
              elif [ -f "$ccbin/$t.exe" ]; then
                cp -f "$ccbin/$t.exe" "$ccbin/x86_64-w64-mingw32-$t.exe" && echo "  $ccbin: created x86_64-w64-mingw32-$t.exe"
              else
                echo "  $ccbin: NO plain $t.exe"
              fi
            done
            cmd //c build_x64.bat
            status=$?
            echo "$status" > build/windows-build-status.txt
            if [ "$status" -eq 0 ] && [ -f pexcraft_x64.exe ]; then
              "$ccbin/x86_64-w64-mingw32-objdump" -p pexcraft_x64.exe 2>/dev/null | sed -n 's/^[[:space:]]*DLL Name: //p' | sort -u > build/imported-dlls.txt || true
              echo "BIN=pexcraft_x64.exe" >> "$GITHUB_ENV"
              echo "BUILD_OK=1" >> "$GITHUB_ENV"
            else
              echo "BUILD_OK=0" >> "$GITHUB_ENV"
            fi
            exit "$status"
          } 2>&1 | tee logs/build-windows-x64.log
          exit ${PIPESTATUS[0]}

      - name: Expose failing build log as annotations
        if: always() && env.BUILD_OK != '1'
        shell: bash
        run: |
          set +e
          log=logs/build-windows-x64.log
          if [ ! -f "$log" ]; then echo "::error::no build log present; an earlier setup step failed"; exit 0; fi
          grep -aiE 'error:|undefined reference' "$log" | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          grep -aiE 'windres|preprocessing failed' "$log" | head -10 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          echo '--- log tail ---'
          tail -n 12 "$log" | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          exit 0

      - name: Package Windows executable
        if: env.BUILD_OK == '1'
        shell: bash
        run: |
          set -euxo pipefail
          package_dir="dist/cob-windows-x64"
          mkdir -p "$package_dir"
          cp -f "$BIN" "$package_dir/call_of_blok_x64.exe"
          # vorbis/ogg/zlib are linked statically (UCRT64 archives); the exe
          # must not import their DLLs. Fail loudly if it still does.
          ccbin=$(cygpath -u "$MINGW64_BIN")
          exe_imports=""
          if command -v strings >/dev/null 2>&1; then
            exe_imports=$(strings -a "$package_dir/call_of_blok_x64.exe" 2>/dev/null | grep -iE '\.dll' | sort -u || true)
          elif [ -f "$ccbin/x86_64-w64-mingw32-objdump" ]; then
            exe_imports=$("$ccbin/x86_64-w64-mingw32-objdump" -p "$package_dir/call_of_blok_x64.exe" | sed -n 's/.*DLL Name: *//p' | sort -u || true)
          else
            echo "(no import-scanner available; skipping static-link verification)"
          fi
          echo "$exe_imports" | tee build/imported-dlls.txt || true
          if [ -n "$exe_imports" ] && echo "$exe_imports" | grep -qiE 'vorbis|ogg-0|zlib1'; then
            echo "::error::exe still imports vorbis/ogg/zlib DLLs; static link failed"
            exit 1
          fi
          cp -R logs "$package_dir/logs" || true
          cat > "$package_dir/COMMIT_NAME.txt" <<EOF
          Commit name: ${{ steps.commit.outputs.name }}
          Commit SHA:  $GITHUB_SHA
          Builder:     CALL of BLOK Windows x64 MinGW64
          EOF
          zip_path="dist/cob-windows-x64.zip"
          (cd "$package_dir" && (command -v zip >/dev/null 2>&1 && zip -r "../$(basename "$zip_path")" . || tar -a -cf "../$(basename "$zip_path")" .))
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

      - name: Upload release artifact
        if: env.BUILD_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: cob-windows-x64
          path: dist/cob-windows-x64.zip
          if-no-files-found: error

      - name: Mark failed build in summary
        if: always() && env.BUILD_OK != '1'
        shell: bash
        run: |
          echo "### Windows x64 failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit name: \`${{ steps.commit.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"


  linux_x64:
    name: Linux x64 (SDL2/OpenGL)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Clone bargmy/PexOfDuty
        uses: actions/checkout@v4
        with:
          repository: bargmy/PexOfDuty
          ref: main
          token: ${{ secrets.PEXOFDUTY_TOKEN || github.token }}
          set-safe-directory: true

      - name: Read commit name
        id: commit
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          name="$(git log -1 --pretty=%s 2>/dev/null || true)"
          [ -n "$name" ] || name="${{ github.ref_name }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Cache Linux compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-${{ runner.arch }}-ccache-v1-${{ hashFiles('Makefile.linux_sdl2', 'third_party/lua/sources.rsp') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-${{ runner.arch }}-ccache-v1-${{ hashFiles('Makefile.linux_sdl2', 'third_party/lua/sources.rsp') }}-
            linux-${{ runner.arch }}-ccache-v1-

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            zlib1g-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            zip

      - name: Build Linux x64 client
        shell: bash
        run: |
          set +e
          mkdir -p build logs dist
          {
            echo "Commit name: ${{ steps.commit.outputs.name }}"
            echo "Commit SHA:  $GITHUB_SHA"
            echo "Builder:     CALL of BLOK Linux SDL2/OpenGL"
            echo
            gcc --version
            ccache --zero-stats
            make -f Makefile.linux_sdl2 CC="ccache gcc"
            status=$?
            ccache --show-stats
            echo "$status" > build/linux-build-status.txt
            if [ "$status" -eq 0 ]; then
              echo "BUILD_OK=1" >> "$GITHUB_ENV"
            else
              echo "BUILD_OK=0" >> "$GITHUB_ENV"
            fi
            exit "$status"
          } 2>&1 | tee logs/build-linux-x64.log
          exit ${PIPESTATUS[0]}

      - name: Expose failing build log as annotations
        if: always() && env.BUILD_OK != '1'
        shell: bash
        run: |
          set +e
          log=logs/build-linux-x64.log
          if [ ! -f "$log" ]; then echo "::error::no build log present; an earlier setup step failed"; exit 0; fi
          grep -anE 'error:|undefined reference' "$log" | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          echo '--- log tail ---'
          tail -n 6 "$log" | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          exit 0

      - name: Package Linux executable
        if: env.BUILD_OK == '1'
        shell: bash
        run: |
          set -euxo pipefail
          package_dir="dist/cob-linux-x64"
          mkdir -p "$package_dir"
          cp -f pexcraft_sdl2 "$package_dir/call_of_blok_sdl2"
          cp -R logs "$package_dir/logs" || true
          cat > "$package_dir/COMMIT_NAME.txt" <<EOF
          Commit name: ${{ steps.commit.outputs.name }}
          Commit SHA:  $GITHUB_SHA
          Builder:     CALL of BLOK Linux SDL2/OpenGL
          EOF
          zip_path="dist/cob-linux-x64.zip"
          (cd "$package_dir" && zip -r "../$(basename "$zip_path")" .)
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

      - name: Upload release artifact
        if: env.BUILD_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: cob-linux-x64
          path: dist/cob-linux-x64.zip
          if-no-files-found: error

      - name: Mark failed build in summary
        if: always() && env.BUILD_OK != '1'
        shell: bash
        run: |
          echo "### Linux x64 failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit name: \`${{ steps.commit.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"


  android:
    name: Android universal APK
    # Temporarily disabled; keep the build steps for re-enabling later.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone bargmy/PexOfDuty
        uses: actions/checkout@v4
        with:
          repository: bargmy/PexOfDuty
          ref: main
          token: ${{ secrets.PEXOFDUTY_TOKEN || github.token }}
          set-safe-directory: true

      - name: Read commit name
        id: commit
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          name="$(git log -1 --pretty=%s 2>/dev/null || true)"
          [ -n "$name" ] || name="${{ github.ref_name }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android build packages
        shell: bash
        env:
          COB_NDK_VERSION: 27.2.12479018
        run: |
          set -u
          mkdir -p logs build dist
          {
            set -ex -o pipefail
            ct="$ANDROID_HOME/cmdline-tools"
            if [ -d "$ct" ]; then
              latest="$(ls -d "$ct"/*/ 2>/dev/null | sort -V | tail -n 1)"
              export PATH="$latest/bin:$ANDROID_HOME/platform-tools:$PATH"
            fi
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            command -v sdkmanager >/dev/null 2>&1 || { echo "!! sdkmanager not found; ANDROID_HOME contents:"; ls "$ANDROID_HOME" 2>/dev/null; ls "$ct" 2>/dev/null; exit 1; }
            sudo apt-get update
            sudo apt-get install -y curl unzip python3
            yes | sdkmanager --licenses >/dev/null || true

            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/ndk/$COB_NDK_VERSION" ~/.android/cache || true
            for attempt in 1 2 3; do
              if sdkmanager --install \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "cmake;3.22.1" \
                "ndk;$COB_NDK_VERSION"; then
                break
              fi
              rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/ndk/$COB_NDK_VERSION" ~/.android/cache || true
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done

            test -x "$ANDROID_HOME/ndk/$COB_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$COB_NDK_VERSION" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$COB_NDK_VERSION" >> "$GITHUB_ENV"
          } 2>&1 | tee logs/android-sdk-setup.log
          exit ${PIPESTATUS[0]}

      - name: Prepare SDL2 Android dependency
        shell: bash
        run: |
          chmod +x android/*.sh || true
          bash android/prepare_sdl2.sh

      - name: Decode release signing key
        env:
          SIGN_BASE64: ${{ secrets.sign }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.SIGN_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.SIGN_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGN_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${SIGN_BASE64:-}" ]; then
            echo "No repository secret named 'sign' was provided; Gradle will produce an unsigned release APK."
            echo "ANDROID_SIGNED=0" >> "$GITHUB_ENV"
          else
            mkdir -p android/app/signing
            printf '%s' "$SIGN_BASE64" | tr -d '\r\n ' | base64 -d > android/app/signing/release.jks
            echo "SIGNING_STORE_FILE=$PWD/android/app/signing/release.jks" >> "$GITHUB_ENV"
            test -n "$SIGNING_STORE_PASSWORD" || { echo "SIGN_BASE64 set but SIGNING_STORE_PASSWORD is missing." >&2; exit 1; }
            echo "ANDROID_SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build Android universal APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.SIGN_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.SIGN_KEY_ALIAS || 'cob_android_tv' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGN_KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p build logs dist
          {
            echo "Commit name: ${{ steps.commit.outputs.name }}"
            echo "Commit SHA:  $GITHUB_SHA"
            echo "Builder:     CALL of BLOK Android universal APK"
            echo
            cd android
            gradle assembleRelease
            status=$?
            cd ..
            echo "$status" > build/android-build-status.txt
            if [ "$status" -eq 0 ]; then
              echo "ANDROID_BUILD_OK=1" >> "$GITHUB_ENV"
            else
              echo "ANDROID_BUILD_OK=0" >> "$GITHUB_ENV"
            fi
            exit "$status"
          } 2>&1 | tee logs/build-android-universal.log
          exit ${PIPESTATUS[0]}

      - name: Expose failing build log as annotations
        if: always() && env.ANDROID_BUILD_OK != '1'
        shell: bash
        run: |
          set +e
          for log in logs/build-android-universal.log logs/android-sdk-setup.log; do
            if [ -f "$log" ]; then
              echo "---- $log error lines ----"
              grep -aE 'error:' "$log" | head -30 | while IFS= read -r line; do
                printf '::error::%s\n' "${line//'%'/'%25'}"
              done
              echo "---- $log (tail) ----"
              tail -n 20 "$log" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//'%'/'%25'}"
              done
              break
            fi
          done
          [ -f logs/build-android-universal.log ] || [ -f logs/android-sdk-setup.log ] || echo "::error::no android build or sdk-setup log present"
          exit 0

      - name: Package Android APK
        if: env.ANDROID_BUILD_OK == '1'
        shell: bash
        run: |
          set -euxo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p dist
          cp -f "$apk" dist/cob-android-universal.apk
          printf 'Commit name: %s\nCommit SHA:  %s\nBuilder:     CALL of BLOK Android universal APK\n' \
            "${{ steps.commit.outputs.name }}" "$GITHUB_SHA" > dist/COMMIT_NAME.txt
          echo "APK_PATH=dist/cob-android-universal.apk" >> "$GITHUB_ENV"

      - name: Upload release artifact
        if: env.ANDROID_BUILD_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: cob-android-universal
          path: dist/cob-android-universal.apk
          if-no-files-found: error

      - name: Mark failed build in summary
        if: always() && env.ANDROID_BUILD_OK != '1'
        shell: bash
        run: |
          echo "### Android universal APK failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit name: \`${{ steps.commit.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"


  release:
    name: Publish GitHub release
    needs: [windows_x64, linux_x64, android]
    # Publish available builds even when another platform fails.
    if: >-
      ${{ !cancelled() &&
          (needs.windows_x64.result == 'success' ||
           needs.linux_x64.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      # This job has no checkout, so gh cannot infer the destination repository.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Determine source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(gh api repos/bargmy/PexOfDuty/commits/main --jq '.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Create tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="cob-build-${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: CALL of BLOK ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          assets=(./*.zip ./*.apk)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded"
            exit 1
          fi
          notes="Built from bargmy/PexOfDuty@${{ steps.source.outputs.sha }}. Includes available successful platform builds. Windows: ${{ needs.windows_x64.result }}; Linux: ${{ needs.linux_x64.result }}; Android: ${{ needs.android.result }} (disabled by default)."
          gh release create "$TAG" "${assets[@]}" \
            --title "$TITLE" \
            --notes "$notes"
